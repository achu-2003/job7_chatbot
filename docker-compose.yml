version: "3.9"

x-app-env: &app-env
  env_file:
    - .env
  environment:
    - PYTHONUNBUFFERED=1

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ecom_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ecom_api
    restart: unless-stopped
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    expose:
      - "8000"
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      --workers 2
      --bind 0.0.0.0:8000
      --timeout 60
      --access-logfile -
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "0.75"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: ecom_worker
    restart: unless-stopped
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: python -m app.workers.embedding_worker
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"

  postgres:
    image: postgres:16-alpine
    container_name: ecom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/triggers.sql:/docker-entrypoint-initdb.d/02_triggers.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: "0.25"

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: ecom_qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    volumes:
      - qdrantdata:/qdrant/storage
    expose:
      - "6333"   # REST
      - "6334"   # gRPC
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ecom_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: ecom_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

volumes:
  pgdata:
  qdrantdata:
  promdata:
  grafanadata:
